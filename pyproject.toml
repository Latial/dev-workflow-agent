[project]
   name = "dev-workflow-agent"
   version = "0.1.0"
   description = "An agent that reads a GitHub issue, drafts a fix with tests, and opens a PR for review."
   requires-python = ">=3.10"
   dependencies = [
       "claude-agent-sdk",
       "httpx",
       "python-dotenv",
       "mcp[cli]",
]

   [project.optional-dependencies]
   dev = ["pytest"]

   [project.scripts]
   devagent = "devagent.cli:main"

   [build-system]
   requires = ["hatchling"]
   build-backend = "hatchling.build"

   [tool.hatch.build.targets.wheel]
   packages = ["src/devagent"]
